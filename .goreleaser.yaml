version: 2

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && for s in bash zsh fish; do go run ./cmd/leet completion $s > completions/leet.$s; done'

builds:
  - id: leet
    main: ./cmd/leet
    binary: leet
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/carlosprados/go-1337/internal/cli.version={{ .Version }}

archives:
  # No version in the name: releases/latest/download/<name> stays a stable link.
  - name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, completions/*]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
